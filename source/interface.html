 function render(){root.dataset.device=state.device;$('#ga-day').textContent='День '+state.day;$('#ga-rep').textContent=state.rep;$('#ga-rep-bar').style.width=Math.min(100,state.rep)+'%';$('#ga-wins').textContent=state.wins;$('#ga-total').textContent='из '+state.completed.length;$('#ga-wins-bar').style.width=(state.wins/4*100)+'%';$('#ga-heat').textContent=state.heat;$('#ga-heat-bar').style.width=state.heat+'%';$('#ga-mail-count').textContent=state.mail.length;root.querySelectorAll('[data-desk]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.desk===state.desk));root.querySelectorAll('[data-phone]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phone===state.phone));root.querySelectorAll('button[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===state.device));$('#ga-desk-content').innerHTML=state.desk==='cases'?casesView():state.desk==='news'?newsView():mailView();$('#ga-phone-content').innerHTML=phoneView();$('#ga-phone-title').textContent=state.phone==='bank'?'Капитал':'Линия';$('#ga-phone-subtitle').textContent=state.phone==='bank'?'Новореченский банк':'Личные контакты';const c=active();$('#ga-court').disabled=!c||!!state.ending;$('#ga-court').textContent=c?'В суд · '+state.proof+'/'+c.target:'В суд';$('#ga-footer-info').textContent=c?'Слушание до дня '+state.deadline:'Каждое решение оставляет след.';const probe=state.investigation;$('#ga-investigation').hidden=!probe;if(probe)$('#ga-investigation').innerHTML=`<strong>Против вас идёт расследование</strong>Материалы обвинения: ${probe.evidence}/100. Решение через ${Math.max(0,probe.due-state.day)} дн. От 75 — тюрьма; от 50 — штраф. ${probe.defended?'Независимая защита уже учтена.':`<br><button type="button" class="cursor-interaction" data-action="defend" ${state.money<25000?'disabled':''}>Нанять защитника · 25 000 ₽</button><br>Один раз: −25 к обвинению, +1 день. Старые следы сохраняются.`}`;if(state.ending&&!playing)showEnding();}
 function offer(){const c=cases[state.selected];if(state.completed.some(v=>v.id===c.id))return;if(state.active!==null){notice('Сначала завершите активное дело: '+active().title+'.');return;}if(state.rep<c.rating){if(!state.mail.some(m=>m.offer===c.id&&m.rep===state.rep)){postMail(c.client,'Отказ: «'+c.title+'»',`Спасибо за предложение. Для этого дела мне нужен адвокат с известностью не ниже ${c.rating}. Ваша известность — ${state.rep}.`);state.mail[0].offer=c.id;state.mail[0].rep=state.rep;}state.desk='mail';notice('Клиент отказал: известность ниже рейтинга дела.');return;}state.active=c.id;state.proof=c.base;state.deadline=state.day+5;postMail(c.client,'Ваше предложение принято',`Доверяю вам дело «${c.title}». Гонорар за победу — ${money(c.fee)}. При проигрыше оплачивается половина. Подготовьтесь к слушанию до дня ${state.deadline}.`);state.desk='mail';chat('Клиент согласился. Начинаем работу.',true);chat('Принято. На подготовку пять дней. Выберите поручение.');notice('Договор заключён. Детективы доступны на телефоне.');}
 function startProbe(){state.investigation={evidence:state.heat,due:state.day+3,defended:false};postMail('Следственный отдел','Начата проверка вашей практики','В делах повторяются жалобы на давление. Через три дня материалы рассмотрят. Каждое новое нарушение усилит обвинение.');state.news.unshift({title:'Деятельностью адвоката заинтересовалось следствие',body:'Несколько свидетелей сообщили о незаконном вмешательстве.'});}

 function checkEnd(){if(state.completed.length===4&&!state.investigation&&!state.ending)state.ending=state.wins===4?'legend':'practice';}

 function resolveCase(won,late=false){const c=active();if(!c)return;const fee=won?c.fee:c.fee/2;transaction('Гонорар: '+c.title,fee);state.rep=Math.min(100,state.rep+(won?c.gain:3));state.wins+=won?1:0;state.completed.push({id:c.id,won});state.active=null;postMail(c.client,won?'Спасибо за защиту':'Дело завершено',`${won?'Суд принял доводы защиты.':late?'Вы пропустили срок слушания.':'Доводов защиты не хватило.'} Гонорар ${money(fee)} поступил на счёт. Известность выросла на ${won?c.gain:3}.`);state.news.unshift({title:won?'Адвокат выиграл дело «'+c.title+'»':'Вердикт по делу «'+c.title+'»',body:won?'Город узнал новое имя. Более крупные клиенты готовы доверить вам защиту.':'Процесс завершён. Даже неудачное дело принесло публичность.'});state.desk='mail';notice(won?'Дело выиграно. Гонорар на счёте, известность выросла.':late?'Срок истёк: дело проиграно.':'Дело проиграно: позиция защиты ниже порога.');checkEnd();}
 function cinema(){if(!active()||playing||state.ending)return;playing=true;const c=active(),won=state.proof>=c.target;const overlay=$('#ga-overlay');overlay.hidden=false;overlay.innerHTML=`<div class="ga-cinema" role="dialog" aria-modal="true" aria-labelledby="ga-cinema-title"><video id="ga-video" playsinline preload="auto" poster="${portrait}" aria-label="Восьмисекундная судебная сцена" src="${videoSource}"></video><div><div class="ga-eyebrow">СУДЕБНОЕ ЗАСЕДАНИЕ · 8 СЕКУНД</div><h2 id="ga-cinema-title">«Мой подзащитный невиновен»</h2><p>${c.title}<br>Позиция защиты: ${state.proof} из необходимых ${c.target}.</p><div class="ga-bar"><span id="ga-film-progress" style="width:0%"></span></div><div class="ga-timer" id="ga-film-time">00:00 / 00:08</div><button type="button" class="ga-secondary cursor-interaction" data-action="skip">Пропустить →</button><button type="button" class="ga-secondary cursor-interaction" data-action="play" hidden>Включить видео</button></div></div>`;const v=$('#ga-video');onFinish=()=>{if(!playing)return;v.pause();playing=false;onFinish=null;overlay.hidden=true;overlay.innerHTML='';resolveCase(won);tick();render();save();if(!state.ending){const dest=$('[data-desk="mail"]');dest.focus();}};v.addEventListener('ended',()=>onFinish?.());v.addEventListener('timeupdate',()=>{if(!playing||$('#ga-video')!==v)return;$('#ga-film-progress').style.width=Math.min(100,v.currentTime/8*100)+'%';$('#ga-film-time').textContent='00:'+String(Math.floor(v.currentTime)).padStart(2,'0')+' / 00:08';});v.addEventListener('error',()=>{if(!playing||$('#ga-video')!==v)return;$('#ga-film-time').textContent='Видео недоступно. Результат можно получить кнопкой «Пропустить».';});v.play().catch(()=>{if(playing&&$('#ga-video')===v)$('[data-action="play"]').hidden=false;});$('[data-action="skip"]').focus();}
 function showEnding(){const overlay=$('#ga-overlay');overlay.hidden=false;let title,body,kicker;if(state.ending==='prison'){kicker='ФИНАЛ · ДЕЛО ПРОТИВ ВАС';title='Теперь вы —<br>подзащитный.';body='Накопленные улики доказали вмешательство в дела. Суд назначил тюремное заключение. Известность не спасла вашу свободу.';}else if(state.ending==='legend'){kicker='ФИНАЛ ДЕМОНСТРАЦИИ';title='Имя, которому<br>доверяет город.';body='Вы завершили четыре дела. В полной кампании впереди выбор: разоблачить владельца холдинга или принять его условия.';}else{kicker='ФИНАЛ ДЕМОНСТРАЦИИ';title='У каждого дела<br>есть цена.';body='Четыре процесса завершены. Ваша известность — '+state.rep+', побед — '+state.wins+'. Попробуйте другой маршрут карьеры.';}overlay.innerHTML=`<div class="ga-end" role="dialog" aria-modal="true" aria-labelledby="ga-end-title"><div class="ga-eyebrow" style="color:#c3a773">${kicker}</div><h2 id="ga-end-title">${title}</h2><p>${body}</p><p style="margin-top:18px;font-size:12px">День ${state.day} · Известность ${state.rep} · Счёт ${money(state.money)}</p><button type="button" class="ga-secondary cursor-interaction" data-action="restart">Новая карьера</button></div>`;$('[data-action="restart"]').focus();}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||!root.contains(b))return;const a=b.dataset.action;if(playing){if(a==='skip')onFinish?.();if(a==='play')$('#ga-video').play().then(()=>{b.hidden=true;}).catch(()=>notice('Нажмите «Пропустить», чтобы перейти к результату.'));return;}if(a==='restart'){state=fresh();$('#ga-overlay').hidden=true;$('#ga-overlay').innerHTML='';notice('Новая практика открыта. Выберите первое дело.');}else if(state.ending)return;else if(b.dataset.desk)state.desk=b.dataset.desk;else if(b.dataset.phone)state.phone=b.dataset.phone;else if(b.dataset.device)state.device=b.dataset.device;else if(b.dataset.case!==undefined){state.selected=Number(b.dataset.case);state.desk='cases';}else if(b.dataset.order)order(b.dataset.order);else if(a==='offer')offer();else if(a==='active'){state.selected=state.active;state.desk='cases';}else if(a==='day'){notice('Наступил следующий день.');state.heat=Math.max(0,state.heat-2);tick();}else if(a==='defend'&&state.investigation&&!state.investigation.defended&&state.money>=25000){transaction('Независимый защитник',-25000);state.investigation.defended=true;state.investigation.evidence=Math.max(0,state.investigation.evidence-25);notice('Защитник проверил материалы. Сила обвинения −25.');tick();}else if(a==='court'){cinema();return;}render();save();});
 root.addEventListener('change',e=>{if(e.target.id==='ga-agent'){state.agent=e.target.value==='irina'?'irina':'mark';render();save();$('#ga-agent')?.focus();}});
 root.addEventListener('keydown',e=>{const overlay=$('#ga-overlay');if(overlay.hidden)return;if(e.key==='Escape'&&playing){e.preventDefault();onFinish?.();return;}if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button:not([hidden]):not(:disabled)')];if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&!playing){restore(e.detail.globals.widgetState);render();}});
 render();
 if(globalThis.Tweak){const design={portrait:true};const tweak=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.ga-portrait').forEach(el=>el.style.filter=design.portrait?'saturate(.6)':'grayscale(1)');}});tweak.addToggle(design,'portrait',{label:'Цветной портрет'});}
})();
</script>
